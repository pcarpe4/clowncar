apiVersion: v1
kind: Namespace
metadata:
  name: bento
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bento-config
  namespace: bento
data:
  config.yaml: |
    input:
      generate:
        count: 100
        interval: ""
        mapping: |
          root.id = uuid_v4()
          root.name = fake("name")
          root.email = fake("email")
          root.created_at = now()
    output:
      sql_raw:
        driver: postgres
        dsn: postgres://${POSTGRESQL_USER}:${POSTGRESQL_PASSWORD}@postgres.bento.svc.cluster.local:5432/${POSTGRESQL_DATABASE}?sslmode=disable
        init_statement: |
          CREATE TABLE IF NOT EXISTS users (
            id TEXT PRIMARY KEY,
            name TEXT,
            email TEXT,
            created_at TIMESTAMP
          );
        query: INSERT INTO users (id, name, email, created_at) VALUES ($1, $2, $3, $4)
        args_mapping: root = [this.id, this.name, this.email, this.created_at]
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-creds
  namespace: bento
type: Opaque
stringData:
  POSTGRESQL_USER: bento
  POSTGRESQL_PASSWORD: bento123
  POSTGRESQL_DATABASE: bentodb
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bento
  namespace: bento
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: bento
            image: ghcr.io/warpstreamlabs/bento:latest
            args: ["-c", "/etc/bento/config.yaml"]
            envFrom:
            - secretRef:
                name: postgres-creds
            volumeMounts:
            - name: config
              mountPath: /etc/bento
              readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
          volumes:
          - name: config
            configMap:
              name: bento-config
          restartPolicy: OnFailure
apiVersion: v1
kind: Namespace
metadata:
  name: bento
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bento
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-16:latest
        envFrom:
        - secretRef:
            name: postgres-creds
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bento
spec:
  selector:
    app: postgres
  ports:
  - port: 5432